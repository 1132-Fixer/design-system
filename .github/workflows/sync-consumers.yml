name: Sync consumer repositories

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-system-consumer-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Sync ${{ matrix.repository }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repository:
          - macos
          # Canonical repository name; the earlier "1132-Fixer-Windows" entry
          # made the app-token step fail ("repository does not exist or is
          # not accessible") on every push since 2026-08-23.
          - windows
          # Renamed from "chrome" on 2026-09-11 (same repository, id
          # 1246919604); the app-token step needs the current name.
          - browser
          - website

    steps:
      - name: Create cross-repository token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DESIGN_SYSTEM_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.DESIGN_SYSTEM_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            design-system
            ${{ matrix.repository }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repository }}
          token: ${{ steps.app-token.outputs.token }}
          submodules: recursive
          path: consumer
          fetch-depth: 0

      - name: Update design system and synced assets
        working-directory: consumer
        env:
          DESIGN_SYSTEM_SHA: ${{ github.sha }}
        run: |
          git -C design-system fetch origin "$DESIGN_SYSTEM_SHA"
          git -C design-system checkout --detach "$DESIGN_SYSTEM_SHA"
          design-system/scripts/brand-assets.sh sync . .brand-assets.tsv

          # Moving the gitlink can invalidate files a consumer keeps in step
          # with it. 1132-Fixer/windows asserts in its own tests that every
          # design-system commit it cites equals the gitlink, so a bump alone
          # left its "Build & Test" red twice: on pull request #219 (ac0f1b1)
          # and again on main after #221 (793d3cf).
          #
          # A consumer that has this problem declares a "design:pin" script.
          # Run it when it exists and do nothing when it does not. The failure
          # is deliberately not swallowed: a sync that cannot bring a consumer
          # to a green state should stop and be seen, not open a pull request
          # that is known to be red.
          #
          # The contract is the script name and one argument, the full 40-hex
          # design-system commit. Nothing here knows which files a consumer
          # keeps in step, and nothing here should.
          #
          # Passing the SHA is required, not a convenience. At this point the
          # submodule WORKING TREE is at $DESIGN_SYSTEM_SHA but the superproject
          # INDEX still records the previous commit, because the gitlink is
          # staged in the next step. A hook that reads the index sees the old
          # value: that is how 1132-Fixer/windows#223 was opened with its
          # gitlink at 08024a1 and its citations rolled to 793d3cf, failing the
          # consumer's own test on a pull request this workflow had just
          # "fixed".
          if [[ -f package.json ]] \
            && node -e 'const s=(require("./package.json").scripts)||{}; process.exit(s["design:pin"]?0:1)'; then
            echo "Running the consumer's design:pin hook for $DESIGN_SYSTEM_SHA"
            npm run design:pin -- "$DESIGN_SYSTEM_SHA"
          else
            echo "No design:pin hook in this consumer; nothing to roll"
          fi

      - name: Commit, push, and open or update pull request
        working-directory: consumer
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository_owner }}/${{ matrix.repository }}
          DESIGN_SYSTEM_SHA: ${{ github.sha }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Consumer already uses $DESIGN_SYSTEM_SHA"
            exit 0
          fi

          app_user_id=$(gh api "/users/$APP_SLUG[bot]" --jq .id)
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$app_user_id+$APP_SLUG[bot]@users.noreply.github.com"

          branch=automation/design-system-sync
          git checkout -B "$branch"
          git add design-system .brand-assets.tsv
          while IFS=$'\t' read -r canonical target; do
            [[ -z ${canonical:-} || ${canonical:0:1} == "#" ]] && continue
            git add -- "$target"
          done < .brand-assets.tsv
          # Whatever the consumer's design:pin hook rewrote. "-u" stages
          # modifications to tracked files only, so a hook cannot add an
          # untracked file to this commit; the checkout is clean apart from
          # this job's own edits.
          git add -u
          git commit -m "Update design system to ${DESIGN_SYSTEM_SHA:0:12}"
          git push --force-with-lease origin "$branch"

          # "gh pr view <branch>" also matches a closed or merged pull request
          # on the same branch. After the first sync pull request merged, this
          # step therefore retitled that merged pull request
          # (1132-Fixer/windows#201, rewritten on 2026-09-11 to name a commit it
          # never contained) and opened nothing, so the pushed submodule bump
          # stayed on the branch unreviewed. Match open pull requests only.
          existing=$(gh pr list --repo "$REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number // empty')

          if [[ -n ${existing:-} ]]; then
            gh pr edit "$existing" \
              --repo "$REPOSITORY" \
              --title "Update design system to ${DESIGN_SYSTEM_SHA:0:12}" \
              --body "Automated design-system submodule and canonical brand asset sync from 1132-Fixer/design-system@$DESIGN_SYSTEM_SHA."
          else
            gh pr create \
              --repo "$REPOSITORY" \
              --head "$branch" \
              --title "Update design system to ${DESIGN_SYSTEM_SHA:0:12}" \
              --body "Automated design-system submodule and canonical brand asset sync from 1132-Fixer/design-system@$DESIGN_SYSTEM_SHA."
          fi
