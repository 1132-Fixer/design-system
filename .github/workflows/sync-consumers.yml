name: Sync consumer repositories

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-system-consumer-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Sync ${{ matrix.repository }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repository:
          - macos
          - 1132-Fixer-Windows
          - chrome
          - website

    steps:
      - name: Create cross-repository token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DESIGN_SYSTEM_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.DESIGN_SYSTEM_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            design-system
            ${{ matrix.repository }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out consumer
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repository }}
          token: ${{ steps.app-token.outputs.token }}
          submodules: recursive
          path: consumer
          fetch-depth: 0

      - name: Update design system and synced assets
        working-directory: consumer
        env:
          DESIGN_SYSTEM_SHA: ${{ github.sha }}
        run: |
          git -C design-system fetch origin "$DESIGN_SYSTEM_SHA"
          git -C design-system checkout --detach "$DESIGN_SYSTEM_SHA"
          design-system/scripts/brand-assets.sh sync . .brand-assets.tsv

      - name: Commit, push, and open or update pull request
        working-directory: consumer
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository_owner }}/${{ matrix.repository }}
          DESIGN_SYSTEM_SHA: ${{ github.sha }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Consumer already uses $DESIGN_SYSTEM_SHA"
            exit 0
          fi

          app_user_id=$(gh api "/users/$APP_SLUG[bot]" --jq .id)
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$app_user_id+$APP_SLUG[bot]@users.noreply.github.com"

          branch=automation/design-system-sync
          git checkout -B "$branch"
          git add design-system .brand-assets.tsv
          while IFS=$'\t' read -r canonical target; do
            [[ -z ${canonical:-} || ${canonical:0:1} == "#" ]] && continue
            git add -- "$target"
          done < .brand-assets.tsv
          git commit -m "Update design system to ${DESIGN_SYSTEM_SHA:0:12}"
          git push --force-with-lease origin "$branch"

          if gh pr view "$branch" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh pr edit "$branch" \
              --repo "$REPOSITORY" \
              --title "Update design system to ${DESIGN_SYSTEM_SHA:0:12}" \
              --body "Automated design-system submodule and canonical brand asset sync from 1132-Fixer/design-system@$DESIGN_SYSTEM_SHA."
          else
            gh pr create \
              --repo "$REPOSITORY" \
              --head "$branch" \
              --title "Update design system to ${DESIGN_SYSTEM_SHA:0:12}" \
              --body "Automated design-system submodule and canonical brand asset sync from 1132-Fixer/design-system@$DESIGN_SYSTEM_SHA."
          fi
